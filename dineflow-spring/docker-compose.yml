version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    environment:
      POSTGRES_DB: dineflow
      POSTGRES_USER: ${DB_USERNAME:-dineflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dineflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dineflow-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dineflow
      DB_USERNAME: ${DB_USERNAME:-dineflow}
      DB_PASSWORD: ${DB_PASSWORD:-dineflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
      PAYMENT_MOCK_SUCCESS_RATE: ${PAYMENT_MOCK_SUCCESS_RATE:-0.9}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-1200}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Angular Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dineflow-frontend
    environment:
      API_URL: ${API_URL:-http://backend:8080}
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
  uploads_data:
