<router-outlet></router-outlet>

<!-- Global Toast Container -->
<div class="fixed bottom-lg right-lg z-[9999] flex flex-col gap-sm pointer-events-none w-full max-w-[320px] ml-auto">
  <div *ngFor="let toast of toasts()" 
       class="pointer-events-auto relative overflow-hidden flex items-start gap-md p-md rounded-md shadow-sm border border-hairline animate-in slide-in-from-bottom-4 fade-in duration-300 bg-surface-bone text-ink">
       
    <!-- Icon -->
    <div class="relative z-10 rounded-sm flex items-center justify-center shrink-0 mt-0.5"
         [ngClass]="{
           'text-primary': toast.type === 'success',
           'text-[#e02424]': toast.type === 'error',
           'text-[#1e429f]': toast.type === 'info'
         }">
      <lucide-icon *ngIf="toast.type === 'success'" name="check-circle" class="size-4"></lucide-icon>
      <lucide-icon *ngIf="toast.type === 'error'" name="x-circle" class="size-4"></lucide-icon>
      <lucide-icon *ngIf="toast.type === 'info'" name="zap" class="size-4"></lucide-icon>
    </div>
    
    <div class="relative z-10 flex-1">
      <h4 class="text-caption font-bold uppercase tracking-widest mb-0.5 m-0"
          [ngClass]="{
            'text-primary': toast.type === 'success',
            'text-[#e02424]': toast.type === 'error',
            'text-[#1e429f]': toast.type === 'info'
          }">
        {{ toast.type === 'success' ? 'Success' : (toast.type === 'error' ? 'Error' : 'Notification') }}
      </h4>
      <p class="text-body-sm text-ink m-0">
        {{ toast.message }}
      </p>
    </div>
    
    <button type="button" (click)="removeToast(toast.id)" 
            class="relative z-10 transition-colors hover:text-ink text-mute mt-0.5 p-0 bg-transparent border-none cursor-pointer">
      <lucide-icon name="x" class="size-3.5"></lucide-icon>
    </button>
  </div>
</div>
