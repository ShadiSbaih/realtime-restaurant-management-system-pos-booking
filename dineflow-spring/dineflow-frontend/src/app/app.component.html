<router-outlet></router-outlet>

<!-- Global Toast Container -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-sm pointer-events-none w-full max-w-[340px]">
  <div *ngFor="let toast of toasts()" 
       class="pointer-events-auto relative overflow-hidden flex items-start gap-md p-md rounded-md shadow-2xl border border-[#333] bg-charcoal text-canvas animate-in slide-in-from-bottom-8 fade-in duration-500 ease-out hover:-translate-y-1 transition-transform">
       
    <!-- Icon -->
    <div class="relative z-10 rounded-sm flex items-center justify-center shrink-0 mt-0.5"
         [ngClass]="{
           'text-primary': toast.type === 'success',
           'text-[#ff5a5f]': toast.type === 'error',
           'text-[#60a5fa]': toast.type === 'info'
         }">
      <lucide-icon *ngIf="toast.type === 'success'" [img]="CheckCircle" class="size-5"></lucide-icon>
      <lucide-icon *ngIf="toast.type === 'error'" [img]="XCircle" class="size-5"></lucide-icon>
      <lucide-icon *ngIf="toast.type === 'info'" [img]="Zap" class="size-5"></lucide-icon>
    </div>
    
    <div class="relative z-10 flex-1">
      <h4 class="text-[10px] font-bold uppercase tracking-widest mb-1 m-0 text-on-dark-mute">
        {{ toast.type === 'success' ? 'Success' : (toast.type === 'error' ? 'Error' : 'Notification') }}
      </h4>
      <p class="text-body-sm m-0 font-medium">
        {{ toast.message }}
      </p>
    </div>
    
    <button type="button" (click)="removeToast(toast.id)" 
            class="relative z-10 transition-colors hover:text-canvas text-on-dark-mute mt-0.5 p-0 bg-transparent border-none cursor-pointer focus:outline-none">
      <lucide-icon [img]="XIcon" class="size-4"></lucide-icon>
    </button>
  </div>
</div>
