spring:
  ai:
    openai:
      base-url: https://api.groq.com/openai/
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:llama-3.1-8b-instant}
          temperature: 0.7

  application:
    name: dineflow-backend
  main:
    allow-circular-references: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dineflow}
    username: ${DB_USERNAME:dineflow}
    password: ${DB_PASSWORD:dineflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: "{baseUrl}/api/auth/callback/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000} # 15 minutes
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

  cors:
    allowed-origins: ${CLIENT_URL:http://localhost:4200}

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

payments:
  mock:
    success-rate: ${PAYMENT_MOCK_SUCCESS_RATE:0.9}
    simulated-delay-ms: ${PAYMENT_MOCK_DELAY_MS:1200}
    currency: ${PAYMENT_MOCK_CURRENCY:USD}

logging:
  level:
    com.dineflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
